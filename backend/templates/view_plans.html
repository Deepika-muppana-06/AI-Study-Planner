<!DOCTYPE html>
<html>

<head>

<title>View AI Plan</title>


<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


</head>


<body>


<div class="dashboard">



<!-- Sidebar -->


<aside class="sidebar">


<h2>📚 AI Planner</h2>


<ul>


<li>

<a href="/dashboard">

<i class="fa-solid fa-house"></i>

Dashboard

</a>

</li>



<li>

<a href="/subjects">

<i class="fa-solid fa-book"></i>

Subjects

</a>

</li>



<li>

<a href="/tasks">

<i class="fa-solid fa-list-check"></i>

Tasks

</a>

</li>



<li>

<a href="/schedule">

<i class="fa-solid fa-calendar-days"></i>

Study Schedule

</a>

</li>




<li class="active">


<a href="/ai_planner">


<i class="fa-solid fa-robot"></i>

AI Planner


</a>


</li>



<li>

<a href="/my_plans">

<i class="fa-solid fa-brain"></i>

My AI Plans

</a>

</li>



<li>

<a href="/progress">

<i class="fa-solid fa-chart-line"></i>

Progress

</a>

</li>

<li>

<a href="/exams">

<i class="fa-solid fa-calendar-check"></i>

Exams

</a>

</li>

<li>

<a href="/logout">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</a>

</li>



</ul>


</aside>


<!-- Content -->


<main class="content">


<div class="topbar">


<div>

<h2>🤖 Your AI Study Plan</h2>

<p>Personalized roadmap generated by AI</p>


</div>


</div>



<div class="plan-container">


<div id="planContent" class="ai-plan-content">


{{ plan.plan_text | safe }}


</div>


</div>


</main>


</div>


</body>


</html>
